<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Plane for Orca: your Plane work items in Orca's sidebar</title>
  <desc id="desc">The Plane panel in Orca's sidebar lists the work items assigned to you by project tab and state: WEB-12 Fix the login redirect, In Progress, high priority, its agent done; WEB-9 Add a dark mode toggle, Todo, its agent needs input. Start on WEB-12 creates the Orca workspace WEB-12-fix-the-login-redirect on a branch of the same name and starts Claude Code with the ticket fenced as untrusted data. The status bar reads 12 · 2 waiting.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#07111f"/><stop offset="0.5" stop-color="#0b0b10"/><stop offset="1" stop-color="#0f0b1c"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.05"/></pattern>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/></filter>
  </defs>

  <rect width="1200" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="400" rx="24" fill="url(#dots)"/>
  <rect x="0.5" y="0.5" width="1199" height="399" rx="24" fill="none" stroke="#26262f"/>

  <g id="title-block">
    <rect x="64" y="72" width="388" height="36" rx="10" fill="#14141c" stroke="#2a2a36" stroke-width="1.5"/>
    <text x="82" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#e5e5e5"><tspan fill="#22c55e">$</tspan> orca plugin install <tspan fill="#8b8b9a">…/</tspan>orca-plane</text>
    <rect x="430" y="82" width="9" height="17" rx="1" fill="#e5e5e5" opacity="0.8"/>
    <text x="58" y="194" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="72" font-weight="700" letter-spacing="-3" fill="url(#word)">orca-plane</text>
    <text x="64" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" fill="#c4c4cc">Your Plane work items in Orca's sidebar,</text>
    <text x="64" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" fill="#c4c4cc">one click from ticket to coding agent.</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">
      <text x="64" y="331" fill="#8b8b9a">agent</text>
      <rect x="118" y="312" width="104" height="28" rx="14" fill="none" stroke="#60a5fa" stroke-width="1.5"/>
      <text x="170" y="331" text-anchor="middle" fill="#e5e5e5"><tspan fill="#60a5fa">●</tspan> Working</text>
      <rect x="234" y="312" width="132" height="28" rx="14" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="300" y="331" text-anchor="middle" fill="#e5e5e5"><tspan fill="#f59e0b">●</tspan> Needs input</text>
      <rect x="378" y="312" width="84" height="28" rx="14" fill="none" stroke="#22c55e" stroke-width="1.5"/>
      <text x="420" y="331" text-anchor="middle" fill="#e5e5e5"><tspan fill="#22c55e">✓</tspan> Done</text>
    </g>
  </g>

  <g id="panel" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <rect x="560" y="52" width="300" height="296" rx="14" fill="#0d0d14" stroke="#2a2a36" stroke-width="1.5"/>
    <text x="580" y="78" font-size="13" fill="#e5e5e5" font-weight="700">Plane</text>
    <text x="840" y="78" text-anchor="end" font-size="12" fill="#5b5b68">acme · complete</text>
    <path d="M560 90 H860" stroke="#2a2a36" stroke-width="1.5"/>
    <text x="580" y="114" font-size="12" fill="#8b8b9a">API 2</text>
    <text x="640" y="114" font-size="12" fill="#8b8b9a">OPS 1</text>
    <text x="700" y="114" font-size="12" fill="#e5e5e5">WEB 2</text>
    <path d="M700 121 H742" stroke="#60a5fa" stroke-width="2"/>
    <text x="580" y="148" font-size="11" letter-spacing="1" fill="#5b5b68">IN PROGRESS · 1</text>
    <rect x="572" y="158" width="276" height="54" rx="8" fill="#0f1a2e" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="586" y="180" font-size="12" fill="#8b8b9a">WEB-12 <tspan fill="#f97316">▲ high</tspan></text>
    <text x="586" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#f5f5f5">Fix the login redirect</text>
    <rect x="782" y="168" width="56" height="20" rx="10" fill="#052e16"/>
    <text x="810" y="182" text-anchor="middle" font-size="11" fill="#22c55e">✓ Done</text>
    <text x="580" y="240" font-size="11" letter-spacing="1" fill="#5b5b68">TODO · 1</text>
    <text x="586" y="266" font-size="12" fill="#8b8b9a">WEB-9 <tspan fill="#eab308">■ medium</tspan></text>
    <text x="586" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#c4c4cc">Add a dark mode toggle</text>
    <rect x="752" y="254" width="86" height="20" rx="10" fill="#451a03"/>
    <text x="795" y="268" text-anchor="middle" font-size="11" fill="#fbbf24">Needs input</text>
    <path d="M560 310 H860" stroke="#2a2a36" stroke-width="1.5"/>
    <text x="580" y="333" font-size="12" fill="#8b8b9a">status bar <tspan fill="#e5e5e5">◆ 12 · 2 waiting</tspan></text>
  </g>

  <path d="M848 185 C 880 185, 878 120, 904 120" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="858" y="210" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#60a5fa">Start</text>

  <g id="workspace" filter="url(#shadow)">
    <rect x="904" y="72" width="248" height="236" rx="12" fill="#0f0b1c" stroke="#a78bfa" stroke-width="1.5"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="922" y="98" font-size="11" letter-spacing="1" fill="#5b5b68">NEW ORCA WORKSPACE</text>
    <text x="922" y="122" font-size="12" fill="#e5e5e5">WEB-12-fix-the-login-</text>
    <text x="922" y="138" font-size="12" fill="#e5e5e5">redirect</text>
    <text x="922" y="160" font-size="11" fill="#8b8b9a">branch <tspan fill="#a78bfa">WEB-12-fix-the-…</tspan></text>
    <text x="922" y="178" font-size="11" fill="#8b8b9a">agent  <tspan fill="#fb923c">claude</tspan></text>
    <rect x="918" y="192" width="220" height="100" rx="8" fill="#0b0b10" stroke="#2a2a36"/>
    <text x="930" y="212" font-size="10.5" fill="#5b5b68">--- ticket: untrusted data ---</text>
    <rect x="930" y="222" width="150" height="8" rx="4" fill="#3a3a48"/>
    <rect x="930" y="238" width="190" height="8" rx="4" fill="#3a3a48"/>
    <rect x="930" y="254" width="120" height="8" rx="4" fill="#3a3a48"/>
    <text x="930" y="282" font-size="10.5" fill="#5b5b68">--- end of ticket ---</text>
  </g>
</svg>
