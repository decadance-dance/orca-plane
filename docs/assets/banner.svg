<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Plane for Orca: your Plane work items in Orca's sidebar, one click from ticket to coding agent</title>
  <desc id="desc">Left: the Plane for Orca icon, the name, the tagline and the chips Assigned to you, Start an agent, Agent status; Unofficial, not made or endorsed by Plane Software, Inc. Right: the Plane panel lists WEB-12 Fix the login redirect, in progress with its agent done, and WEB-9 Add a dark mode toggle, in Todo with its agent needing input; Start on WEB-12 creates the Orca workspace WEB-12-fix-the-login-redirect on a branch of the same name and starts Claude Code with the ticket fenced as untrusted data. The status bar reads 12 · 2 waiting.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#07111f"/><stop offset="0.5" stop-color="#0b0b10"/><stop offset="1" stop-color="#0f0b1c"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.05"/></pattern>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/></filter>
    <radialGradient id="glow" cx="0.12" cy="0.2" r="0.8"><stop offset="0" stop-color="#3F76FF" stop-opacity="0.26"/><stop offset="1" stop-color="#3F76FF" stop-opacity="0"/></radialGradient>
  </defs>

  <rect width="1200" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="400" rx="24" fill="url(#dots)"/>
  <rect x="0.5" y="0.5" width="1199" height="399" rx="24" fill="none" stroke="#26262f"/>

  <rect width="1200" height="400" rx="24" fill="url(#glow)"/>
  <g id="title-block">
    <g transform="translate(64 56) scale(0.125)"><rect width="512" height="512" rx="112" fill="#3F76FF"/><path transform="translate(86 140) scale(4)" d="M44.3223 2.9264C44.3223 0.754665 46.6083 -0.65811 48.5508 0.313121L80.4551 16.2653C82.9294 17.5024 84.4922 20.0321 84.4922 22.7985V48.2487C84.4922 50.4204 82.2071 51.833 80.2646 50.8619L62.3281 41.8932V22.7975C62.3281 20.0311 60.7653 17.5015 58.291 16.2643L44.3223 9.27992V2.9264ZM0 2.92543C8.01645e-05 0.753753 2.28609 -0.659069 4.22852 0.312144L22.1582 9.27699V28.3766C22.1582 31.1428 23.7213 33.6716 26.1953 34.9088L40.1699 41.8952V48.2487C40.1697 50.4202 37.8847 51.832 35.9424 50.861L4.03711 34.9088C1.56305 33.6716 0 31.1428 0 28.3766V2.92543ZM22.1582 2.92543C22.1583 0.753753 24.4443 -0.659069 26.3867 0.312144L44.3223 9.27992V28.3776C44.3223 31.1439 45.8861 33.6727 48.3604 34.9098L62.3281 41.8932V48.2487C62.3279 50.4202 60.0429 51.832 58.1006 50.861L40.1699 41.8952V22.7975C40.1699 20.0311 38.6071 17.5015 36.1328 16.2643L22.1582 9.27699V2.92543Z" fill="#fff"/><circle cx="408" cy="408" r="76" fill="#0b0b10" stroke="#3F76FF" stroke-width="12"/><text x="408" y="432" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="72" font-weight="700" fill="#a78bfa">›_</text></g>
    <text x="60" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="-1.5" fill="#f5f5f5">Plane <tspan fill="url(#word)">for Orca</tspan></text>
    <text x="64" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#c4c4cc">Your work items in Orca's sidebar,</text>
    <text x="64" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#c4c4cc">one click from ticket to coding agent.</text>
    <rect x="64" y="296" width="144" height="30" rx="15" fill="none" stroke="#3b3b4a" stroke-width="1.5"/><text x="136" y="316" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#d4d4dc">Assigned to you</text><rect x="216.0" y="296" width="136" height="30" rx="15" fill="none" stroke="#3b3b4a" stroke-width="1.5"/><text x="284" y="316" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#d4d4dc">Start an agent</text><rect x="359.6" y="296" width="119" height="30" rx="15" fill="none" stroke="#3b3b4a" stroke-width="1.5"/><text x="419" y="316" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#d4d4dc">Agent status</text>
    <text x="64" y="364" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#6b6b78">Unofficial. Not made or endorsed by Plane Software, Inc.</text>
  </g>

  <g id="panel" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <rect x="560" y="52" width="300" height="296" rx="14" fill="#0d0d14" stroke="#2a2a36" stroke-width="1.5"/>
    <text x="580" y="78" font-size="13" fill="#e5e5e5" font-weight="700">Plane</text>
    <text x="840" y="78" text-anchor="end" font-size="12" fill="#5b5b68">acme · complete</text>
    <path d="M560 90 H860" stroke="#2a2a36" stroke-width="1.5"/>
    <text x="580" y="114" font-size="12" fill="#8b8b9a">API 2</text>
    <text x="640" y="114" font-size="12" fill="#8b8b9a">OPS 1</text>
    <text x="700" y="114" font-size="12" fill="#e5e5e5">WEB 2</text>
    <path d="M700 121 H742" stroke="#60a5fa" stroke-width="2"/>
    <text x="580" y="148" font-size="11" letter-spacing="1" fill="#5b5b68">IN PROGRESS · 1</text>
    <rect x="572" y="158" width="276" height="54" rx="8" fill="#0f1a2e" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="586" y="180" font-size="12" fill="#8b8b9a">WEB-12 <tspan fill="#f97316">▲ high</tspan></text>
    <text x="586" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#f5f5f5">Fix the login redirect</text>
    <rect x="782" y="168" width="56" height="20" rx="10" fill="#052e16"/>
    <text x="810" y="182" text-anchor="middle" font-size="11" fill="#22c55e">✓ Done</text>
    <text x="580" y="240" font-size="11" letter-spacing="1" fill="#5b5b68">TODO · 1</text>
    <text x="586" y="266" font-size="12" fill="#8b8b9a">WEB-9 <tspan fill="#eab308">■ medium</tspan></text>
    <text x="586" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#c4c4cc">Add a dark mode toggle</text>
    <rect x="752" y="254" width="86" height="20" rx="10" fill="#451a03"/>
    <text x="795" y="268" text-anchor="middle" font-size="11" fill="#fbbf24">Needs input</text>
    <path d="M560 310 H860" stroke="#2a2a36" stroke-width="1.5"/>
    <text x="580" y="333" font-size="12" fill="#8b8b9a">status bar <tspan fill="#e5e5e5">◆ 12 · 2 waiting</tspan></text>
  </g>

  <path d="M848 185 C 880 185, 878 120, 904 120" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="3 3"/>
  
  <g id="workspace" filter="url(#shadow)">
    <rect x="904" y="72" width="248" height="236" rx="12" fill="#0f0b1c" stroke="#a78bfa" stroke-width="1.5"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="922" y="98" font-size="11" letter-spacing="1" fill="#5b5b68">NEW ORCA WORKSPACE</text>
    <text x="922" y="122" font-size="12" fill="#e5e5e5">WEB-12-fix-the-login-</text>
    <text x="922" y="138" font-size="12" fill="#e5e5e5">redirect</text>
    <text x="922" y="160" font-size="11" fill="#8b8b9a">branch <tspan fill="#a78bfa">WEB-12-fix-the-…</tspan></text>
    <text x="922" y="178" font-size="11" fill="#8b8b9a">agent  <tspan fill="#fb923c">claude</tspan></text>
    <rect x="918" y="192" width="220" height="100" rx="8" fill="#0b0b10" stroke="#2a2a36"/>
    <text x="930" y="212" font-size="10.5" fill="#5b5b68">--- ticket: untrusted data ---</text>
    <rect x="930" y="222" width="150" height="8" rx="4" fill="#3a3a48"/>
    <rect x="930" y="238" width="190" height="8" rx="4" fill="#3a3a48"/>
    <rect x="930" y="254" width="120" height="8" rx="4" fill="#3a3a48"/>
    <text x="930" y="282" font-size="10.5" fill="#5b5b68">--- end of ticket ---</text>
  </g>
</svg>
